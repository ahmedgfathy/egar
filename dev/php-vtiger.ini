; Vtiger CRM PHP settings - based on official system requirements
; https://it-solutions4you.com/vtiger-system-requirements/

file_uploads = On
upload_max_filesize = 50M
post_max_size = 128M
max_execution_time = 600
max_input_time = 120
max_input_vars = 10000
memory_limit = 512M
output_buffering = On
default_charset = "UTF-8"
display_errors = Off
log_errors = On
error_reporting = E_WARNING & ~E_NOTICE
short_open_tag = Off

; Extensions (already installed as packages)
; extension = gd
; extension = mysqli
; extension = mbstring
; extension = bcmath
; extension = curl
; (All loaded via php8.5-* packages)

; Vtiger-specific
date.timezone = UTC
pcre.jit = 0
session.auto_start = Off
default_socket_timeout = 600
